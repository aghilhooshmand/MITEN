# Static Breakthrough Ledger on GitHub Pages
name: static-pages

on:
  push:
    branches: [main, master]
    paths:
      - "static-site/**"
      - ".github/workflows/static-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: static-site
      - id: deploy
        uses: actions/deploy-pages@v4
