services:
  mysql:
    image: mysql:8.4
    container_name: breakthrough-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ledger_root
      MYSQL_DATABASE: breakthrough_ledger
      MYSQL_USER: ledger
      MYSQL_PASSWORD: ledger
    ports:
      - "3306:3306"
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pledger_root"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
