services:
  mysql:
    image: mysql:8.4
    container_name: miten-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-ledger_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-breakthrough_ledger}
      MYSQL_USER: ${MYSQL_USER:-ledger}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ledger}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-pledger_root"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: miten-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_USER: ${MYSQL_USER:-ledger}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-ledger}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-breakthrough_ledger}
      SEED_MODE: ${SEED_MODE:-static}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s

  web:
    build:
      context: ./frontend
    container_name: miten-web
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${MITEN_PORT:-8080}:80"

volumes:
  mysql_data:
